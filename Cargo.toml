[package]
name = "petal-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
# `petal-hawdb`, the HawDB program the desktops download, is a workspace of its own.
exclude = ["hawdb-helper"]

[lib]
path = "src/lib.rs"

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }

[dependencies]
nsh-graph = "0.1.1"
nsh-core = "0.6.0"
serde_json = "1"

# HawDB is most of an app that links it (about 36 MB), so the desktops don't: they download `petal-hawdb`
# (`hawdb-helper/`) the first time HawDB is used and run it. iOS and Android, which don't run downloaded
# programs, link it in. The web has none.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
petal-hawdb = { path = "hawdb-helper" }

# Checking and unpacking the downloaded `petal-hawdb`.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
sha2 = "0.10"
flate2 = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Bolt, the binary protocol of Memgraph (and Neo4j): a client of its own, on a Tokio runtime of Petal's.
# 0.9 decodes small negative integers right (0.8 reads -1 as 255) and speaks Bolt 4.3 and 4.4.
neo4rs = "=0.9.0-rc.11"
# The runtime of Bolt and of the MCP endpoint (`src/mcp.rs`), which listens on 127.0.0.1.
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "io-util", "macros"] }
chrono = { version = "0.4", default-features = false }
