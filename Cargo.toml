[package]
name = "petal-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }

[dependencies]
nsh-graph = "0.2.0"
nsh-core = "0.6.0"
serde_json = "1"

# HawDB is an embedded engine: it opens a directory on this machine, so it is linked on the desktops and phones,
# not in the web build (its in-browser build is experimental and in-memory only).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hawdb = { version = "0.34", default-features = false }
# Bolt, the binary protocol of Memgraph (and Neo4j): a client of its own, on a Tokio runtime of Petal's.
# 0.9 decodes small negative integers right (0.8 reads -1 as 255) and speaks Bolt 4.3 and 4.4.
neo4rs = "=0.9.0-rc.11"
# The runtime of Bolt and of the MCP endpoint (`src/mcp.rs`), which listens on 127.0.0.1.
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "io-util", "macros"] }
chrono = { version = "0.4", default-features = false }
