[package]
name = "petal-hawdb"
# The helper's own version: a release of it is tagged `hawdb-helper-v<version>`, and Petal pins the
# version and the checksums of its builds (`graph/hawdbHelper.ts`).
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "HawDB for Petal, as a program Petal downloads and talks to over stdin and stdout"

# A workspace of its own: Petal's desktop builds don't depend on it, and its release builds don't take
# Petal's settings.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "petal-hawdb"
path = "src/main.rs"

[dependencies]
hawdb = { version = "0.34", default-features = false }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
